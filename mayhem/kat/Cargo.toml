[package]
name = "jaq-mayhem-kat"
version = "0.0.0"
publish = false
edition = "2021"

# Own workspace root (see mayhem/fuzz/Cargo.toml for why): keeps this additive crate out of the
# upstream root Cargo.toml's explicit `members = [...]` list, which we never edit.
[workspace]

[[bin]]
name = "kat"
path = "src/main.rs"

[dependencies]
jaq-core = { path = "../../jaq-core" }
jaq-std  = { path = "../../jaq-std" }
jaq-json = { path = "../../jaq-json" }
